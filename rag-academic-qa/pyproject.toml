[project]
name = "rag-academic-qa"
version = "1.0.0"
description = "基于 RAG 的学术文献智能问答系统"
requires-python = ">=3.10"

# ======================== Ruff (lint + format) ========================
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["faiss_index", "data", "logs"]

[tool.ruff.lint]
# 启用规则: E=pycodestyle, F=pyflakes, I=isort, W=warnings, UP=pyupgrade
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # 行长度由 formatter 管
    "E402",  # 模块级 import 位置（项目有 sys.path 注入需求）
]

[tool.ruff.lint.isort]
known-first-party = ["config", "modules", "gui", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ======================== MyPy (类型检查) ========================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "faiss_index/|data/|logs/|tests/"

# 对第三方库不做严格检查
[[tool.mypy.overrides]]
module = ["langchain.*", "dashscope.*", "pypdf.*", "PySide6.*"]
ignore_missing_imports = true

# ======================== Pytest ========================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
